plugins {
    id 'org.beryx.runtime' version '2.0.1'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

ext.appMainClass = "com.shatteredpixel.shatteredpixeldungeon.desktop.DesktopLauncher"
application.mainClass = appMainClass
processResources {
    from new File(project(':core').projectDir, "/src/main/assets")
    from new File(project(':desktop').projectDir,"/src/main/assets")
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)

tasks.register('probeClasspath') {
    group = 'desktop'
    description = 'Prints the runtime classpath so entry points can be launched without gradle.'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

tasks.register('replay', JavaExec) {
    group = 'desktop'
    description = 'Plays a recorded run back in the rendered game.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.replay.ReplayLauncher'
    //Diagnostics and unattended-playback options, all opt-in so a normal launch is unaffected.
    if (project.hasProperty('spdTrace')) { systemProperty 'spd.trace', '1' }
    if (project.hasProperty('spdAutoClose')) { systemProperty 'spd.autoClose', '1' }
    if (project.hasProperty('spdAutoCloseOnDiverge')) { systemProperty 'spd.autoCloseOnDiverge', '1' }
    if (project.hasProperty('spdMonitorX')) { systemProperty 'spd.monitorX', project.property('spdMonitorX') }
    if (project.hasProperty('spdMonitorY')) { systemProperty 'spd.monitorY', project.property('spdMonitorY') }
    if (project.hasProperty('spdMute')) { systemProperty 'spd.mute', '1' }
    if (project.hasProperty('spdFast')) { systemProperty 'spd.fast', project.property('spdFast') }
    if (project.hasProperty('spdWindowed')) { systemProperty 'spd.windowed', '1' }
    systemProperty 'Implementation-Title', appPackageName
    systemProperty 'Implementation-Version', appVersionCode
    standardInput = System.in
}

 //Writes a standalone launcher, so playback can bypass gradle entirely.
 //See :replaycp.
 //
 //The classpath is over 11,000 characters. Handing it to java through a batch variable lost
 //characters - the run failed with NoClassDefFoundError for a gdx class that is plainly on the
 //classpath - so it is baked into a script file here instead, where nothing has to re-expand it.
tasks.register('replaycp') {
    group = 'desktop'
    description = 'Writes a standalone replay launcher, for running playback without gradle.'
    dependsOn tasks.named( 'classes' )
    dependsOn configurations.runtimeClasspath
    def out = file( new File( buildDir, 'replay-run.bat' ))
    def cpOut = file( new File( buildDir, 'replay-classpath.txt' ))
    outputs.files( out, cpOut )
    //Declared as an input, so a change to core or to a dependency regenerates the launcher. Without
    //this the task had outputs but no inputs: gradle saw them present, called the task up to date, and
    //left the launcher pointing at a stale core jar. That surfaced as NoSuchFieldError on a core field
    //that had plainly just been compiled.
    inputs.files( sourceSets.main.runtimeClasspath )
    doLast {
        def cp = sourceSets.main.runtimeClasspath.asPath
        cpOut.text = cp
        out.text = "@echo off\r\njava -cp \"${cp}\" %*\r\n"
        println "wrote " + out
    }
}

tasks.register('debug', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    ignoreExitValue = true

    mainClass = appMainClass
    systemProperty 'Specification-Title', appName
    systemProperty 'Implementation-Title', appPackageName
    systemProperty 'Specification-Version', appVersionName + "-INDEV"
    systemProperty 'Implementation-Version', appVersionCode

    if (osName.contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('release', Jar) {
    //FIXME this is now needed as of gradle 7.0, due to our weird sourceSets setup. Should see if there's a better way to do this
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }

    manifest {
        attributes 'Main-Class': appMainClass
        attributes 'Specification-Title': appName
        attributes 'Implementation-Title': appPackageName
        attributes 'Specification-Version': appVersionName
        attributes 'Implementation-Version': appVersionCode
    }
}
installDist.dependsOn release
startScripts.dependsOn release
jpackageImage.dependsOn release

runtime {
    modules = ['java.base',
               'java.desktop',
               'jdk.unsupported',
               'jdk.crypto.cryptoki',
               'jdk.management']
    options = ['--strip-debug',
               '--compress', '2',
               '--no-header-files',
               '--no-man-pages',
               '--strip-native-commands',
               '--vm', 'server']

    jpackage {
        mainClass = appMainClass
        appVersion = (appVersionName =~ /\d+\.\d+\.\d+/)[0]
        imageName = appName
    }

    if (osName.contains('windows')) {
        //May work on Windows 7 (2009), but that's old enough that I'm only officially supporting Windows 10 (2015)
        targetPlatform("win") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.17_10.zip")
            javaHome = file("./build/jdks/win/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/win/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/windows.ico"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('linux')) {
        //May work on glibc 2.12 (2010), but that's old enough that I'm only officially supporting glibc 2.17 (2012)
        targetPlatform("linux") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_linux_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/linux/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/linux/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/icon_256.png"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('mac')) {
        //This JDK officially supports MacOS 12 (2021), but internals suggest support for 10.12 (2016)
        targetPlatform("mac") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_mac_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/mac/jdk-17.0.17+10/Contents/Home/").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/mac/jdk-17.0.17+10/Contents/Home/")
                imageOptions = ["--icon", file("./src/main/assets/icons/mac.icns"),
                                "--java-options", "-XstartOnFirstThread",
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions",
                                //append .apple because com.shatteredpixel.shatteredpixeldungeon was taken =(
                                "--mac-package-identifier", appPackageName + ".apple"]
            }
        }
    }

}

dependencies {
    implementation project(':core')

    //The replay viewer plays a recording by re-applying its actions through ActionMapper, which is
    //the same seam the game's own cell selector uses. Reusing it rather than duplicating it means
    //the viewer inherits the game's action resolution unchanged - attack versus loot versus stairs
    //versus menu - and cannot drift from the headless verifier that already checks replays.
    implementation project(':superintelligence')

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"

    //we use LWJGL tinyFD directly to display crash messages
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-windows"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-macos"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-macos-arm64"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-linux"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-linux-arm64"

    implementation project(':services:updates:githubUpdates')
    implementation project(':services:news:shatteredNews')
}