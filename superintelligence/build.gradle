apply plugin: 'java-library'
apply plugin: 'application'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

//The RL framework runs the game logic with the noosa/libGDX render layer bypassed,
//so it is a plain JVM module. It depends on :core for the game itself and inherits
//libGDX through :SPD-classes.
dependencies {
    implementation project(':core')

    //com.watabou.utils.PlatformSupport has an abstract method that returns a freetype font
    //generator, so the type must be on the compile classpath even though headless never
    //instantiates one. SPD-classes declares gdx-freetype as 'implementation', which does not
    //leak transitively.
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    //ItemSpriteSheet.Icons resolves a TextureFilm in its static initialiser, and ~890 files
    //reference those icon constants from their own static/instance initialisers. Avoiding the
    //film would mean touching the item tree everywhere, so instead we let it be built: Pixmap
    //decodes the PNG on the CPU, and HeadlessGl absorbs every GL call it triggers. See
    //HeadlessServices.install for why this is contained.
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

ext.appMainClass = 'com.shatteredpixel.shatteredpixeldungeon.superintelligence.Main'
application.mainClass = appMainClass

//ItemSpriteSheet.Icons decodes sprites/item_icons.png the first time any item is constructed,
//so the asset tree has to be on the classpath even though nothing is ever drawn. The :core jar
//does not bundle assets - the desktop launcher copies them in, and so must every other headless
//entry point. See HeadlessFiles.getFileHandle for how these paths are resolved.
processResources {
    from new File(project(':core').projectDir, '/src/main/assets')
    from new File(projectDir, '/src/main/assets')
}

//jvmArgs are sized for the worker processes spawned by the trainer; see
//com.shatteredpixel.shatteredpixeldungeon.superintelligence.headless.HeadlessBootstrap
def trainerJvmArgs = [
        '-Xms256m',
        '-Xmx1536m',
        //The game allocates heavily per turn; keeping the young gen large and the old gen
        //small avoids full GCs mid-rollout. See research.md "Garbage Collection and Memory Pooling".
        '-XX:+UseParallelGC',
        '-XX:MaxGCPauseMillis=200',
        //A 1,000-sim sweep must never be killed by the OS for touching unused natives.
        '-XX:+IgnoreUnrecognizedVMOptions',
        //HeadlessServices loads the libGDX natives; without this a JDK that restricts native access
        //warns on every launch
        '--enable-native-access=ALL-UNNAMED',
        '-Djava.awt.headless=true'
]

tasks.register('probeClasspath') {
    group = 'superintelligence'
    description = 'Prints the runtime classpath so the headless entry points can be launched without gradle.'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

//Main dispatches on argv[0], so each task has to put its own subcommand in front. A plain
//`args = [...]` assignment would not survive `--args`, which Gradle applies over the top of
//the build-script value, so the subcommand is prepended at execution time instead. That way
//both `gradle :superintelligence:rollout` and
//`gradle :superintelligence:rollout --args="--seed x"` reach Main correctly.
def withSubcommand = { task, String command ->
    task.doFirst {
        //a caller who already spelled out the subcommand keeps it
        if (!args || args[0].startsWith('--')) args = [command] + args
    }
}

tasks.register('train', JavaExec) {
    group = 'superintelligence'
    description = 'Runs the PPO/IMPALA trainer over a pool of worker processes.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = appMainClass
    jvmArgs trainerJvmArgs
    //without this, `gradle :superintelligence:train --args="--workers 8"` reached Main with no
    //subcommand at all and died on "unknown command: --workers"
    withSubcommand(delegate, 'train')
}

def cliTask = { String taskName, String taskDescription ->
    tasks.register(taskName, JavaExec) {
        group = 'superintelligence'
        description = taskDescription
        classpath = sourceSets.main.runtimeClasspath
        mainClass = appMainClass
        jvmArgs trainerJvmArgs
        withSubcommand(delegate, taskName)
    }
}

cliTask('rollout', 'Runs a single headless episode on a locked seed with the scripted policy.')

cliTask('gradcheck', 'Finite-difference check of the network gradients against the analytic ones.')

cliTask('verify', 'Re-executes a recorded run headlessly and confirms it still reproduces.')

cliTask('modecheck', 'Fails if the environment cannot reach one of its own action modes.')

cliTask('restartcheck', 'Fails if restarting a run does not rebuild the same first floor.')

cliTask('updatecost', 'Measures what a PPO update costs and projects it across sample rates.')

cliTask('gaecheck', 'Fails if the two advantage implementations disagree, or sampling misbehaves.')

cliTask('replays', 'Lists recordings, grouped by hero class and ranked by score.')

cliTask('replaycheck', 'Fails if the replay catalog misgroups, misranks or misresolves a name.')

cliTask('collectcheck', 'Fails if a recording made by the collector will not replay exactly.')

//Everything the trainer and its workers need on one classpath, so a worker can be launched
//with a plain `java -cp` instead of forking gradle.
tasks.register('workerJar', Jar) {
    group = 'superintelligence'
    description = 'Self-contained jar used to launch training worker JVMs.'
    dependsOn configurations.runtimeClasspath
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': appMainClass
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
