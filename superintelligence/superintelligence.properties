# Environment and learning settings for the :superintelligence module.
#
# Every value below is the compiled default. That is deliberate: the file is a starting point to edit,
# not a required input. A run with no --config and no SPD_* variables behaves exactly as it did before
# this file existed, which is what makes adding one a non-event for anyone already training.
#
# HOW A VALUE IS CHOSEN, lowest priority first:
#   1. the defaults in this file (which are the defaults in EnvConfig and PpoHyperparameters)
#   2. SPD_* environment variables, which override this file
#      rl.learning_rate -> SPD_RL_LEARNING_RATE
#   3. command-line flags, which override everything
#
# So a shell can do SPD_RL_LEARNING_RATE=1e-3 without editing anything, a .env loaded by the shell works
# identically, and a person who typed --max-turns 400 still gets 400.
#
# A value that cannot be read is refused rather than defaulted: this system is only useful if its
# settings are the ones it says they are. An unrecognised key warns and names itself.
#
# Two of these values are load-bearing between processes and must agree on both sides, which is why they
# live in one place rather than being written out on the wire by two classes that happen to default
# alike: rl.max_sampled_per_episode (the trainer requests it, the worker applies it) and rl.gamma /
# rl.gae_lambda (the worker computes the advantages with them).

# --- action space geometry -------------------------------------------------------------

# Inventory slots the slot head covers. 96 is the game's own ceiling - a 20-slot backpack plus four
# 19-slot bags. It was 32, which silently truncated two thirds of what the hero can carry, and the
# truncation was invisible rather than refused. Raising this widens the network's input and its slot
# head, so it invalidates checkpoints trained at another width.
env.max_slots=96

# Board size fed to the CNN, covering the widest floors plus the hero's 8-tile view radius.
# This is the single largest memory cost in the framework: a sampled observation is
# spatial_channels * grid_width * grid_height * 4 bytes, which is ~46KB at 48x48 and ~26KB at 32x32.
# A checkpoint records the size it was trained at and refuses to load into a differently-shaped one.
env.grid_width=48
env.grid_height=48

# --- episode limits --------------------------------------------------------------------

# Hard cap on hero turns per floor. research.md asks for one: without it an agent that farms
# Regeneration or paces in a shop never terminates and the run score means nothing. Ending the episode
# this way is marked truncated, so GAE bootstraps through it rather than learning that the floor was
# worthless.
env.turn_limit_per_floor=1500

# Whole-episode cap across all floors. A backstop for a policy that keeps descending.
env.turn_limit_total=40000

# Actor steps allowed before control returns to the agent. Reached only when the engine waits on
# something the agent cannot influence, eg. a chain of buffs on a mob; a legitimate turn needs few.
env.actor_step_limit=20000

# Consecutive turns with no change to HP, depth, position or inventory before the episode is called
# stalled. Stalling is free (priced by reward.turn_cost only) - it was -5.0 once, against death's -100,
# and a 20-generation run found that and ended 100% of its episodes that way.
env.stall_limit=120

# Steps on one floor that may advance no engine time at all before the episode is called stalled.
#
# A SECOND stall guard, and it is here because the first one cannot see this. env.stall_limit counts
# consecutive steps where the hero's cell and health are unchanged, so ONE MOVE RESETS IT - which is
# exactly what a free-action loop does. Measured on a trainer recording: 502 of 1215 steps advanced no
# engine time, 41% of that episode's whole cost, almost all of it OPEN_INVENTORY followed by CANCEL out
# of INVENTORY with a real move between pairs. The position guard never reached its hundred.
#
# Priced as well as bounded: reward.free_step_cost_factor prices each of those steps at half a turn, and
# this ends the episode when there have been too many. The bound is a stall, and a stall costs more than
# dying. 40 rather than 120 because 120 was binding - four of ten recordings from the run that set it
# ended exactly on it - which made the pre-terminal charge larger than the terminal it led up to.
env.free_step_budget=250

# --- items -----------------------------------------------------------------------------

# Allow equipping and unequipping from the inventory pane. Recorded in every replay header, because a
# recorded slot index means something different when this is false.
env.allow_equipping=true

# Allow the alchemy pot. Reachable headlessly since Action.ALCHEMY landed: the sub-mode enumerates
# Recipe.findRecipe over what the hero is carrying rather than going through AlchemyScene, which
# needs a renderer.
env.allow_alchemy=true

# Whether USE and OPEN_INVENTORY are offered only when the hero carries an item whose use does
# something, rather than whenever anything is carried at all.
#
# An equip toggle is a legal use and costs no engine time - WndUseItem.onClick calls item.execute and
# returns - so with the looser mask a hero whose only inventory is its starting weapon can reach the
# sub-mode, toggle, leave, and do it again, every step of it charged at half a turn against
# env.free_step_budget. The item stays available through DROP and through the INVENTORY sub-mode the
# agent reaches by other routes; what this hides is the entry that has nothing to do behind it.
env.sub_mode_progress_only=true

# Record the gameplay RNG draw count and order fingerprint on every step of a recording.
#
# A recording that will not replay says where it stopped diverging - a cell, a health value, a clock.
# It does not say whether the two sides had consumed the same randomness by then, which is the
# question issues.md 18 and 37 both turn on: one is a position divergence and one is a single
# extra engine turn, and neither is distinguishable from a scheduler branch that differed without
# the streams ever separating.
#
# The cost is one increment and two multiply-xors per draw, inside a record call every draw path
# already makes. Off means a recording carries no stream information at all.
env.record_rng_fingerprint=true

# How far an open dialog is aged per environment step, in the game's own seconds. Chasm's "jump?"
# prompt declines to act until its own elapsed counter passes this, and the only thing that ever moved
# that counter was a rendered frame loop - so headlessly the game was asked a question and the answer
# thrown away. Aging once per step is once per frame, the same approximation the replay viewer makes.
env.dialog_age_seconds=0.2

# --- reward shaping ---------------------------------------------------------------------

# Which reward terms are allowed to pay at all. default pays every one of them; depth_only silences
# every term except the objective and the price of stopping, so reaching a new floor or winning is the
# only route to a positive score and the only negatives left are the per-turn cost, the charge for a
# step the engine resolved for free, running out of turns, dying and stalling.
#
# TEMPORARY OVERRIDE. Every weight below still applies when it is on - nothing is re-priced, terms are
# silenced - so `default` restores the whole reward function. It exists because the objective cannot be
# measured through a function that also pays for exploration: a run can score well without ever leaving
# floor 1, and that is indistinguishable from a run that learned to descend.
#
# A worker gets the profile over the params frame rather than from its own configuration, so a trainer
# and its workers cannot disagree about what a run was worth. `rewardcheck` asserts the property in
# both directions: that depth_only pays nothing outside the objective, and that default still pays
# everything.
#
#   reward.profile -> SPD_REWARD_PROFILE
reward.profile=default

# Per-ENGINE-TURN penalty, which is what makes idling cost something rather than being free.
#
# Scaled by what Actor.now() says the step consumed, floored at one turn. The floor matters: WAIT and
# REST cost the episode a decision without advancing the clock at all, so scaling purely by the clock
# made idling free - 121 stalls charged 0.004 - which is the degenerate strategy rewardcheck exists to
# forbid. And the scaling matters just as much: Hero.search calls spendAndNext(TIME_TO_SEARCH) where
# TIME_TO_SEARCH is 2, so a search buys two engine turns - in which other actors act and the hero can be
# hit - for the price of one. Charged per step, that was a subsidy for the action that most reliably
# finds nothing: 189 of 940 steps took half the run's engine time at half price.
#
# WAS 0.002. At that value a turn was so cheap that a whole floor's 1500-turn budget cost -3.00 against
# a +25 descent, so idling a floor was nearly free and nothing else in the reward function was doing
# any work.
#
# **Every reward below is on this scale, and depth is the objective.** One floor is 1500 turns, so 1500
# points, and a descent is priced to beat idling out the floor it leaves:
#
#     idling a floor      1500 turns x 1.0 = -1500, plus turn_limit_penalty -2000  ->  -3500
#     descending at 500   500 turns x 1.0 =  -500, plus depth_reward       +1800  ->  +1300
#
# The gap between those is the whole objective and it is 4800 points wide. Every incidental term is
# worth a fraction of a descent on purpose, because a term the agent can farm competes with the
# objective rather than serving it:
#
#     depth_reward        1800   1.2 floors   <- THE OBJECTIVE
#     talent_reward        400   0.27 floors  <- was 7000 (4.7 floors), which OUTBID depth
#     kill_reward          150   0.10 floors
#     sneak_attack_reward  300   0.20 floors
#     victory_reward     60000  40   floors    <- 26 floors of descent and change. Was 1000.
#     explore_reward      0.05             per tile: 120 tiles = 6, against 1800 for a descent
#
# rewardcheck asserts that depth outbids every incidental term, because a talent point at 4.7 floors put
# levelling above descending and the objective inverted without anything crashing.
reward.turn_cost=1.0

# Per-floor-advance reward, and the primary goal. Survives the sparse phase of the curriculum.
#
# THIS IS THE NUMBER TO CHANGE FIRST when depth does not move. A regular floor holds several hundred
# walkable tiles, so exploration alone can bank more than descending pays - and every run so far has
# wandered rather than taken the stairs, with bestDepth 1 in every generation of every run. The ratio
# between depth_reward and explore_reward *is* the objective; everything else here is a correction on
# it. Larger than the whole of a floor's exploration by an order of magnitude.
reward.depth_reward=1800.0

# Per never-before-seen tile, faded out by the curriculum. Small on purpose: it is a hint toward moving,
# not a reason to prefer moving to arriving. At 0.05 a single floor mapped without descending was worth
# more than reaching the next one.
reward.explore_reward=0.05
# Weight on the shaped reward for closing the gap to this floor's stairs, gamma*Phi(s') - Phi(s) with
# Phi the negative breadth-first distance. It is shaping rather than a reward, which is the whole point:
# it telescopes over an episode, so a round trip pays nothing and only genuinely arriving pays. Set it to
# 0 to measure what it was worth - floor 1 is several hundred tiles, so a descent has to be reachable
# before the run can be about descending.
reward.stair_potential_weight=2.0

# Per point of maximum HP gained.
reward.max_hp_reward=0.5

# Per talent point spent.
#
# BIG, deliberately - most of a floor's 25.0. Levelling itself pays 2 per level and that is correct: a
# level gives +1 attack, +1 defence and a little max HP and happens whether the agent plays well or not.
# A talent point is a different thing. It is a permanent choice about WHICH gains to take, and the
# choices are not remotely equal: LiquidAgility 2 is infinite evasion, VeteranIntuition 2 identifies the
# hero's armour the instant it is taken, GrowingPower 1 is +75% speed. Paying a point the same as a
# level would say the choice does not matter, which is the opposite of what the game is built on.
#
# Sized so that spending a point clearly beats another turn of the same floor - that is what gives an
# action the agent would otherwise have no reason to take a reason to exist.
#
# NOT YET REACHABLE: spending a point is UI-only (TalentButton -> TalentsPane -> WndHero) and none of
# that exists headlessly, so this term cannot fire in a real run yet. The emission site is wired and
# gated; the missing action is TODO.md 1.10.
reward.talent_reward=400.0

# Per point of gold gained.
reward.gold_reward=0.05

# Per point of health lost.
#
# SIZED AGAINST death_penalty, not picked. A floor-1 hero has 20 HP, so this x 20 is what losing a full
# health bar costs: 50, which is half a death. At the old 0.25 it was 5 - five per cent - and a run dying
# 100% of its episodes had NO GRADIENT AT ALL: every episode returned the same -100 terminal, and the
# only term that varied was worth a twentieth of it. The policy cannot learn from that, and two runs
# confirmed it.
#
# The relationship is the property: damage_penalty x heroMaxHP should be within an order of magnitude of
# death_penalty, AND kill_reward must cover what a fight costs. Halving one without the others
# unbalances it - which is exactly what happened at 5.0 with kill_reward still 3.0, where killing a rat
# cost 40 and paid 3 and fighting was a net -37.
#
# KNOWN WEAKNESS: a linear per-HP penalty is depth-dependent because the bar grows. At 2.5 a floor-1 bar
# is half a death and a floor-5 bar (~60 HP) is one and a half. Recorded, not designed away; making both
# sides scale with depth is a RewardModel change rather than a config change.
reward.damage_penalty=40.0

# Per hostile mob killed. Read from Statistics.enemiesSlain, the engine's own counter.
# This term existed and never fired, so fighting was worth nothing while being hit cost something.
#
# Sized against damage_penalty: a floor-1 rat is ~8 HP and a melee kill trades about half that, so a
# melee kill is close to break-even and the PROFITABLE kill is the one that costs nothing.
reward.kill_reward=150.0

# Extra reward for a surprise attack, on top of the kill. Read from Statistics.sneakAttacks, which
# Mob.defenseProc increments exactly when Mob.surprisedBy holds - the mob has not seen the hero.
#
# Deliberately the largest combat payout, because it is the only combat outcome that COSTS THE HERO
# NOTHING: Mob.surprisedBy skips the defender's defence skill outright, so the same hit takes far more
# off the same health pool and no health comes back. A kill is paid for damage dealt, which depends on
# the weapon and on rolls; a surprise attack is paid for arriving unseen, which depends on where the
# hero walked.
#
# Fighting has to be worth doing and the only way it is worth doing is to not be hit. Paying both
# outcomes the same teaches trading blows, and trading blows is what the recorded deaths look like.
reward.sneak_attack_reward=300.0

# What a step that advanced no engine time costs, as a fraction of what a real turn costs.
#
# Equipping and unequipping spend no engine time at all - WndUseItem.onClick calls item.execute and
# returns - so they are free actions in the real game too, and duelist-mid alternated them for 120
# consecutive steps. This prices them: half a turn, which is not nothing.
#
# WAS reward.no_progress_penalty=12.0, an absolute penalty, and the shape of that was wrong twice over.
# A free step cost thirteen ordinary steps, so a dead-end episode paid 40 x 12 = 480 - and at the old
# 120-step budget, 1,440 - in per-step charges BEFORE the stall terminal: the same behaviour charged
# twice, with the per-step half drowning out the ordering the terminal exists to express. It was also a
# second number where the question is a ratio.
#
# THE TRADE, stated plainly: cheaper than a turn is a subsidy, so the cheapest action available to a
# policy is now the free one. What stops it being farmed is env.free_step_budget, not this price. Raise
# this toward 1.0 if a run starts preferring free steps to real ones.
reward.free_step_cost_factor=0.5

# Terminal penalty for dying. Large on purpose: death should dominate any accumulated micro-reward,
# or an agent will trade a point of health for a turn of movement.
reward.death_penalty=2500.0

# Terminal penalty for giving up. WORSE than dying, which is the whole point.
#
# Dying moved the run forward and closed a floor. A stall is a run that stopped, on a hero who is alive
# and has not been asked to do anything difficult. Charging the two equally balanced the price and lost
# the distinction, because to a learner they are one number with two labels - and the lesson that
# survives is that quitting is survivable. Set above death_penalty deliberately; the ordering is what
# takes "stop" off the menu.
reward.stall_penalty=3000.0

# Terminal penalty for running out of a floor's turn budget without descending.
#
# Was turn_cost * 100 - a fifth of a point, against a +10 depth reward. A hero could spend 1500 turns
# mapping a floor, bank the exploration, and be charged almost nothing for never reaching the stairs.
# With exploration paying per tile, idling out the clock was a strategy rather than a failure.
reward.turn_limit_penalty=2000.0

# Terminal reward for clearing the final floor. Above death's magnitude so that winning is not a
# wash, and reachable - a +1000 return is what forced the critic off a tanh bound of [-1, +1].
reward.victory_reward=60000.0

# --- the terms that were Java literals ------------------------------------------------------------
#
# Every weight above is a key in this file. These twenty were numbers written into RewardModel,
# which meant configcheck could not reach them, no .env could set them, and no run could be told
# what they were. They are all still the same values; they are now settings like the rest.

# Per carried item newly identified.
reward.identified_reward=0.5

# Per cursed item newly worn, and its inverse: a carried, known-cursed item that stops being cursed
# without leaving the backpack. The "without leaving" half is what separates it from a drop.
reward.curse_equipped_penalty=-5.0
reward.curse_removed_reward=1.5

# Per equipped item the hero is too weak to wear properly. The game does not refuse the equip -
# Armor.STRReq is an encumbrance and Hero.drRoll charges two points per point of shortfall - so
# the state to count is the shortfall itself.
reward.equip_too_strong_penalty=-2.0

# Per negative status effect cured, and the charge for eating before starving.
reward.cured_debuff_reward=1.5
reward.eaten_early_penalty=-1.0

# Charge for a sub-mode action that neither advanced the clock nor left the sub-mode. No such
# action is reachable today, so this pays nothing; the key exists so the day one appears its
# price is a decision rather than a literal.
reward.menu_noop_penalty=-1.0

# Per level gained and per point of strength gained.
reward.level_up_reward=2.0
reward.strength_gain_reward=1.0

# Gold lost is charged at gold_reward times this, because a shop loop has to cost more than the
# gold it moves.
reward.gold_lost_factor=2.0

# What the carried inventory is worth, per bag, per upgrade of a carried equippable, and the base
# value of anything else. These decide ITEM_PICKUP and ITEM_DROPPED.
reward.item_value_bag=3.0
reward.item_value_equip_base=1.0
reward.item_value_equip_level=0.5
reward.item_value_other=0.5

# BOSS_SLAIN pays depth_reward times this, and one step's worth of healing pays max_hp_reward times
# at most this many points of health, so a full potion is worth more than a top-off.
reward.boss_slain_factor=2.0
reward.max_hp_gain_cap=10.0

# Per item brewed at the alchemy pot, read from Statistics.itemsCrafted, and the extra for a
# meat pie specifically - which docs.md names, and which the game has no counter of its own for.
# The pot is reachable headlessly: Action.ALCHEMY opens a sub-mode over Recipe.findRecipes
# rather than AlchemyScene, which needs a renderer.
reward.craft_reward=25.0
reward.craft_meat_pie_reward=100.0

# Depths over which the dense-to-sparse fade runs: shaping is priced at 1.0 up to the start depth,
# 0.0 from the end depth, and smoothstepped strictly between. Nothing has passed floor 2 in this
# project's history, so the scale has been 1.0 on every episode so far.
reward.curriculum_fade_start_depth=3
reward.curriculum_fade_end_depth=10

# --- learning ---------------------------------------------------------------------------

# Adam step size. Must equal the value Network steps with; PpoHyperparameters holds the one copy.
rl.learning_rate=0.0003

# Discount factor: how far ahead a reward counts.
rl.gamma=0.99

# GAE trace decay, the bias/variance dial of the advantage estimator. Together with gamma this sets the
# span an advantage is supported over - 1/(1-gamma*lambda) is about 17 steps - which is why the
# collector always retains an episode's last 20.
rl.gae_lambda=0.95

# PPO's surrogate clip range, bounding how far one update may move on a single sample. The reported
# clip fraction counts samples whose ratio fell outside it, not samples whose advantage exceeded it:
# the latter is P(|N(0,1)| > 0.2) = 0.8415 for every batch, which is the constant that hid for so long.
rl.clip_epsilon=0.2

# Entropy bonus, the pressure keeping exploration alive.
rl.entropy_coefficient=0.01

# Passes over the buffer per update. Two, not four: the update's dominant cost is forward and backward,
# so epochs scale it linearly, and four would be 300 Adam steps over a 2400-sample batch - more
# optimiser movement than a batch that size supports. Measured 11.29 ms/sample at 4 epochs, ~5.6 at 2.
rl.epochs=2

# Samples per minibatch, which sets the gradient reduction size in a parallel update.
rl.minibatch_size=32

# Threads for the update. 0 or 1 is the serial path, exactly - one means the untouched original, not a
# one-threaded pool, because the serial path is what parallelcheck compares against. Higher is capped
# against the machine at run time. Left at 1 deliberately: defaulting both this and the worker count to
# "all the cores" would oversubscribe a machine that is already using every core for workers.
rl.update_threads=1

# Fraction of an episode's transitions whose observation reaches the trainer. The update cost is
# linear in it: at 5% and 2 epochs that is ~53 s of trainer CPU per generation. Clamped to [0,1], and
# 0 is a real setting rather than "off" - the collector always keeps an episode's last 20 steps.
rl.sample_rate=0.05

# Ceiling on one worker's retained observations, ~98MB at 2048. This replaced a trainer-side
# rolloutCap, which bounded the wrong end: an episode of 40000 turns at ~49KB a step is ~1.9GB
# against a 1536m worker heap, and the cap never applied to collection anyway.
rl.max_sampled_per_episode=2048

# Ceiling on the trainer's update buffer across all workers in one generation, ~397MB. At 20 workers
# the two caps are a factor of 20 apart, and one long episode can put the trainer into swap on a
# machine with a 2GB pagefile - which does not degrade gracefully, it thrashes.
rl.max_samples_per_generation=8192

# Seconds a worker may be silent before the run is failed as a protocol desync. A blocked pipe costs no
# CPU, so without this a stall is indistinguishable from a long episode - and a desynchronised protocol
# does not crash, it hangs with both processes idle, which is the worst failure mode for a long job.
rl.stall_seconds=180

# --- the recurrent gradient ---------------------------------------------------------------
# Consecutive steps per backpropagated run. ONE is a length-one truncation: no gradient crosses a
# timestep and the LSTM's hidden-to-hidden weights learn nothing the trunk could not, which in a
# partially observed grid game is the whole reason the recurrent layer is there. Sixteen is about the
# span an advantage is supported over (1/(1-gamma*lambda) is 17 at the defaults).
rl.chunk_length=16

# Steps at the end of every episode that are kept whatever the sample rate says. The death penalty and
# the depth reward each land on a single step, and under uniform sampling that step survives with
# probability equal to the sample rate - so most episodes would contribute no terminal signal at all.
rl.tail_steps=20

# --- the critic ----------------------------------------------------------------------------
# Ask the critic for a return normalised by its running scale rather than the raw one. The reward
# function is priced for the agent, not the optimiser: a stall costs 3000 and a descent pays 1800, so
# raw returns sit in the thousands, valueLoss ran to 12,432-31,323, and the shared trunk's gradient was
# then squashed by global clipping - taking the policy's update with it.
rl.normalise_values=true
rl.value_norm_momentum=0.01
rl.value_loss_coefficient=0.5

# Ceiling on one sample's value residual, and whether the loss is Huber rather than squared. A terminal
# penalty is one of the few samples in a batch that say anything about dying; squared, its gradient is
# two orders of magnitude above every other sample's.
rl.value_gradient_clip=10.0
rl.huber_values=true

# --- the optimiser -------------------------------------------------------------------------
# Global gradient norm ceiling, applied before every Adam step. It is a ceiling, not a target: when the
# critic dominates the shared trunk, this is what silently shrinks the actor's update towards zero.
rl.max_grad_norm=0.5
rl.adam_beta1=0.9
rl.adam_beta2=0.999
rl.adam_eps=1.0E-8

# --- the run --------------------------------------------------------------------------------
# Fraction of episodes handed a random seed even when one was asked for. Zero is a real setting and not
# "off": it is what makes two runs of one configuration comparable, which they otherwise are not -
# three repeats of one config and one fixed seed put bestScore 1,595 points apart and bestDepth on 1 or
# 2 at chance.
train.random_seed_rate=0.10
train.checkpoint_every=25
train.record_every=1

# --- pipes and worker JVMs ------------------------------------------------------------------
# The pipe buffer is 1 MB rather than the 4 KB a Windows pipe reports, because a policy push is ~14 MB.
ipc.pipe_buffer_bytes=1048576

# Bytes per write when pushing weights, kept under the 4 KB system buffer a Windows pipe really has: one
# 14 MB write exhausted the kernel's anonymous pipe buffer and killed the run at generation ~22.
ipc.push_chunk_bytes=32768

# The worker heap. 1536 MB on a machine with 8 GB of RAM is four workers at most, and a heap that is too
# small shows up as an out-of-memory twenty generations in rather than as an error at launch.
worker.heap_min=256m
worker.heap_max=1536m
worker.gc_pause_ms=200
