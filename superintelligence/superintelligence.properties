# Environment and learning settings for the :superintelligence module.
#
# Every value below is the compiled default. That is deliberate: the file is a starting point to edit,
# not a required input. A run with no --config and no SPD_* variables behaves exactly as it did before
# this file existed, which is what makes adding one a non-event for anyone already training.
#
# HOW A VALUE IS CHOSEN, lowest priority first:
#   1. the defaults in this file (which are the defaults in EnvConfig and PpoHyperparameters)
#   2. SPD_* environment variables, which override this file
#      rl.learning_rate -> SPD_RL_LEARNING_RATE
#   3. command-line flags, which override everything
#
# So a shell can do SPD_RL_LEARNING_RATE=1e-3 without editing anything, a .env loaded by the shell works
# identically, and a person who typed --max-turns 400 still gets 400.
#
# A value that cannot be read is refused rather than defaulted: this system is only useful if its
# settings are the ones it says they are. An unrecognised key warns and names itself.
#
# Two of these values are load-bearing between processes and must agree on both sides, which is why they
# live in one place rather than being written out on the wire by two classes that happen to default
# alike: rl.max_sampled_per_episode (the trainer requests it, the worker applies it) and rl.gamma /
# rl.gae_lambda (the worker computes the advantages with them).

# --- action space geometry -------------------------------------------------------------

# Inventory slots the slot head covers. Backpack capacity is 20 plus one per bag, so 32 covers a
# fully-loaded hero with room to spare. Raising this widens the network's input and its slot head.
env.max_slots=32

# Board size fed to the CNN, covering the widest floors plus the hero's 8-tile view radius.
# This is the single largest memory cost in the framework: a sampled observation is
# spatial_channels * grid_width * grid_height * 4 bytes, which is ~46KB at 48x48 and ~26KB at 32x32.
# A checkpoint records the size it was trained at and refuses to load into a differently-shaped one.
env.grid_width=48
env.grid_height=48

# --- episode limits --------------------------------------------------------------------

# Hard cap on hero turns per floor. research.md asks for one: without it an agent that farms
# Regeneration or paces in a shop never terminates and the run score means nothing. Ending the episode
# this way is marked truncated, so GAE bootstraps through it rather than learning that the floor was
# worthless.
env.turn_limit_per_floor=1500

# Whole-episode cap across all floors. A backstop for a policy that keeps descending.
env.turn_limit_total=40000

# Actor steps allowed before control returns to the agent. Reached only when the engine waits on
# something the agent cannot influence, eg. a chain of buffs on a mob; a legitimate turn needs few.
env.actor_step_limit=20000

# Consecutive turns with no change to HP, depth, position or inventory before the episode is called
# stalled. Stalling is free (priced by reward.turn_cost only) - it was -5.0 once, against death's -100,
# and a 20-generation run found that and ended 100% of its episodes that way.
env.stall_limit=120

# --- vision ----------------------------------------------------------------------------

# Clamp on hero.viewDistance when building the observation grid.
env.max_view_distance=12

# Vision buffs (Light, Magical Sight) are honoured, as they are for a human player.
env.honour_vision_buffs=true

# Mimics stay visible outside the field of view once seen. The game models this with
# GameScene.afterObserve, and replicating it keeps the agent's information set equal to a player's
# rather than strictly smaller - docs.md asks for exactly this.
env.mimics_visible_out_of_fog=true

# --- items -----------------------------------------------------------------------------

# Allow equipping and unequipping from the inventory pane. Recorded in every replay header, because a
# recorded slot index means something different when this is false.
env.allow_equipping=true

# Allow shop and blacksmith dialogs. Read by nothing today: Hero.handle resolves those paths
# regardless. Present so the gap is visible in one place rather than inferred from behaviour.
env.allow_trading=true

# Allow the alchemy pot. Also read by nothing today - see TODO.md section 2.2 on why the crafting
# reward terms are dead, which is the same root cause.
env.allow_alchemy=true

# Let the game's save code write to disk. Off by default: a rollout performs millions of turns' worth
# of incidental saves, and none of them are ever read back.
env.persist_saves=false

# --- reward shaping ---------------------------------------------------------------------

# Per-ENGINE-TURN penalty, which is what makes idling cost something rather than being free.
#
# Scaled by what Actor.now() says the step consumed, floored at one turn. The floor matters: WAIT and
# REST cost the episode a decision without advancing the clock at all, so scaling purely by the clock
# made idling free - 121 stalls charged 0.004 - which is the degenerate strategy rewardcheck exists to
# forbid. And the scaling matters just as much: Hero.search calls spendAndNext(TIME_TO_SEARCH) where
# TIME_TO_SEARCH is 2, so a search buys two engine turns - in which other actors act and the hero can be
# hit - for the price of one. Charged per step, that was a subsidy for the action that most reliably
# finds nothing: 189 of 940 steps took half the run's engine time at half price.
#
# WAS 0.002. At that value a turn was so cheap that a whole floor's 1500-turn budget cost -3.00 against
# a +25 descent, so idling a floor was nearly free and nothing else in the reward function was doing
# any work. At 1.0 a floor's budget is -1500, which is why every reward below is on the same scale as a
# turn rather than the one it was tuned against: with death at -100, dying would have been *cheaper*
# than playing 100 turns, and a free action at -0.05 would have been 20x cheaper than a real one. The
# numbers are not arbitrary - rewardcheck asserts every one of these relationships as a property.
reward.turn_cost=1.0

# Per-floor-advance reward, and the primary goal. Survives the sparse phase of the curriculum.
#
# THIS IS THE NUMBER TO CHANGE FIRST when depth does not move. A regular floor holds several hundred
# walkable tiles, so exploration alone can bank more than descending pays - and every run so far has
# wandered rather than taken the stairs, with bestDepth 1 in every generation of every run. The ratio
# between depth_reward and explore_reward *is* the objective; everything else here is a correction on
# it. Larger than the whole of a floor's exploration by an order of magnitude.
reward.depth_reward=2500.0

# Per never-before-seen tile, faded out by the curriculum. Small on purpose: it is a hint toward moving,
# not a reason to prefer moving to arriving. At 0.05 a single floor mapped without descending was worth
# more than reaching the next one.
reward.explore_reward=1.0

# Per point of maximum HP gained.
reward.max_hp_reward=50.0

# Per talent point spent.
#
# BIG, deliberately - most of a floor's 25.0. Levelling itself pays 2 per level and that is correct: a
# level gives +1 attack, +1 defence and a little max HP and happens whether the agent plays well or not.
# A talent point is a different thing. It is a permanent choice about WHICH gains to take, and the
# choices are not remotely equal: LiquidAgility 2 is infinite evasion, VeteranIntuition 2 identifies the
# hero's armour the instant it is taken, GrowingPower 1 is +75% speed. Paying a point the same as a
# level would say the choice does not matter, which is the opposite of what the game is built on.
#
# Sized so that spending a point clearly beats another turn of the same floor - that is what gives an
# action the agent would otherwise have no reason to take a reason to exist.
#
# NOT YET REACHABLE: spending a point is UI-only (TalentButton -> TalentsPane -> WndHero) and none of
# that exists headlessly, so this term cannot fire in a real run yet. The emission site is wired and
# gated; the missing action is TODO.md 1.10.
reward.talent_reward=8000.0

# Per point of gold gained.
reward.gold_reward=5.0

# Per point of health lost.
#
# SIZED AGAINST death_penalty, not picked. A floor-1 hero has 20 HP, so this x 20 is what losing a full
# health bar costs: 50, which is half a death. At the old 0.25 it was 5 - five per cent - and a run dying
# 100% of its episodes had NO GRADIENT AT ALL: every episode returned the same -100 terminal, and the
# only term that varied was worth a twentieth of it. The policy cannot learn from that, and two runs
# confirmed it.
#
# The relationship is the property: damage_penalty x heroMaxHP should be within an order of magnitude of
# death_penalty, AND kill_reward must cover what a fight costs. Halving one without the others
# unbalances it - which is exactly what happened at 5.0 with kill_reward still 3.0, where killing a rat
# cost 40 and paid 3 and fighting was a net -37.
#
# KNOWN WEAKNESS: a linear per-HP penalty is depth-dependent because the bar grows. At 2.5 a floor-1 bar
# is half a death and a floor-5 bar (~60 HP) is one and a half. Recorded, not designed away; making both
# sides scale with depth is a RewardModel change rather than a config change.
reward.damage_penalty=250.0

# Per hostile mob killed. Read from Statistics.enemiesSlain, the engine's own counter.
# This term existed and never fired, so fighting was worth nothing while being hit cost something.
#
# Sized against damage_penalty: a floor-1 rat is ~8 HP and a melee kill trades about half that, so a
# melee kill is close to break-even and the PROFITABLE kill is the one that costs nothing.
reward.kill_reward=1200.0

# Extra reward for a surprise attack, on top of the kill. Read from Statistics.sneakAttacks, which
# Mob.defenseProc increments exactly when Mob.surprisedBy holds - the mob has not seen the hero.
#
# Deliberately the largest combat payout, because it is the only combat outcome that COSTS THE HERO
# NOTHING: Mob.surprisedBy skips the defender's defence skill outright, so the same hit takes far more
# off the same health pool and no health comes back. A kill is paid for damage dealt, which depends on
# the weapon and on rolls; a surprise attack is paid for arriving unseen, which depends on where the
# hero walked.
#
# Fighting has to be worth doing and the only way it is worth doing is to not be hit. Paying both
# outcomes the same teaches trading blows, and trading blows is what the recorded deaths look like.
reward.sneak_attack_reward=2200.0

# A step the game resolved for free: equipping and unequipping spend no engine time at all, because
# WndUseItem.onClick calls item.execute and returns. duelist-mid alternated the two for 120 consecutive
# steps at zero engine time, which the stall guard correctly called a stall but which cost almost nothing
# until it did. Charged per step rather than handled by the guard, because the guard decides when an
# episode ends and changing that would invalidate every recording in the corpus.
reward.no_progress_penalty=20.0

# Terminal penalty for dying. Large on purpose: death should dominate any accumulated micro-reward,
# or an agent will trade a point of health for a turn of movement.
reward.death_penalty=2000.0

# Terminal penalty for giving up. WORSE than dying, which is the whole point.
#
# Dying moved the run forward and closed a floor. A stall is a run that stopped, on a hero who is alive
# and has not been asked to do anything difficult. Charging the two equally balanced the price and lost
# the distinction, because to a learner they are one number with two labels - and the lesson that
# survives is that quitting is survivable. Set above death_penalty deliberately; the ordering is what
# takes "stop" off the menu.
reward.stall_penalty=3000.0

# Terminal penalty for running out of a floor's turn budget without descending.
#
# Was turn_cost * 100 - a fifth of a point, against a +10 depth reward. A hero could spend 1500 turns
# mapping a floor, bank the exploration, and be charged almost nothing for never reaching the stairs.
# With exploration paying per tile, idling out the clock was a strategy rather than a failure.
reward.turn_limit_penalty=1500.0

# Terminal reward for clearing the final floor. Above death's magnitude so that winning is not a
# wash, and reachable - a +1000 return is what forced the critic off a tanh bound of [-1, +1].
reward.victory_reward=100000.0

# Curriculum stage, 0..1. Drives the dense-to-sparse fade. Written here so the reward function is
# reproducible from a file; on the trainer side Curriculum.observe is driven by observed depth and
# this is only the starting value.
reward.curriculum_progress=0.0

# --- learning ---------------------------------------------------------------------------

# Adam step size. Must equal the value Network steps with; PpoHyperparameters holds the one copy.
rl.learning_rate=0.0003

# Discount factor: how far ahead a reward counts.
rl.gamma=0.99

# GAE trace decay, the bias/variance dial of the advantage estimator. Together with gamma this sets the
# span an advantage is supported over - 1/(1-gamma*lambda) is about 17 steps - which is why the
# collector always retains an episode's last 20.
rl.gae_lambda=0.95

# PPO's surrogate clip range, bounding how far one update may move on a single sample. The reported
# clip fraction counts samples whose ratio fell outside it, not samples whose advantage exceeded it:
# the latter is P(|N(0,1)| > 0.2) = 0.8415 for every batch, which is the constant that hid for so long.
rl.clip_epsilon=0.2

# Entropy bonus, the pressure keeping exploration alive.
rl.entropy_coefficient=0.01

# Passes over the buffer per update. Two, not four: the update's dominant cost is forward and backward,
# so epochs scale it linearly, and four would be 300 Adam steps over a 2400-sample batch - more
# optimiser movement than a batch that size supports. Measured 11.29 ms/sample at 4 epochs, ~5.6 at 2.
rl.epochs=2

# Samples per minibatch, which sets the gradient reduction size in a parallel update.
rl.minibatch_size=32

# Threads for the update. 0 or 1 is the serial path, exactly - one means the untouched original, not a
# one-threaded pool, because the serial path is what parallelcheck compares against. Higher is capped
# against the machine at run time. Left at 1 deliberately: defaulting both this and the worker count to
# "all the cores" would oversubscribe a machine that is already using every core for workers.
rl.update_threads=1

# Fraction of an episode's transitions whose observation reaches the trainer. The update cost is
# linear in it: at 5% and 2 epochs that is ~53 s of trainer CPU per generation. Clamped to [0,1], and
# 0 is a real setting rather than "off" - the collector always keeps an episode's last 20 steps.
rl.sample_rate=0.05

# Ceiling on one worker's retained observations, ~98MB at 2048. This replaced a trainer-side
# rolloutCap, which bounded the wrong end: an episode of 40000 turns at ~49KB a step is ~1.9GB
# against a 1536m worker heap, and the cap never applied to collection anyway.
rl.max_sampled_per_episode=2048

# Ceiling on the trainer's update buffer across all workers in one generation, ~397MB. At 20 workers
# the two caps are a factor of 20 apart, and one long episode can put the trainer into swap on a
# machine with a 2GB pagefile - which does not degrade gracefully, it thrashes.
rl.max_samples_per_generation=8192

# Seconds a worker may be silent before the run is failed as a protocol desync. A blocked pipe costs no
# CPU, so without this a stall is indistinguishable from a long episode - and a desynchronised protocol
# does not crash, it hangs with both processes idle, which is the worst failure mode for a long job.
rl.stall_seconds=180
